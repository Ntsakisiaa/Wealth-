services:
  - type: web
    name: forex-signals
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 2 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: REFRESH_MIN
        value: "15"
      - key: PAIRS
        value: EURUSD,GBPUSD,USDJPY,AUDUSD,USDCAD,USDCHF
